apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: taskgrid-worker-cpu
spec:
  scaleTargetRef:
    name: taskgrid-worker-cpu
  minReplicaCount: 0
  maxReplicaCount: 5
  pollingInterval: 5
  cooldownPeriod: 30
  triggers:
    - type: redis
      metadata:
        address: redis.default.svc.cluster.local:6379
        listName: taskgrid:jobs:cpu
        listLength: "2"
