apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskgrid-worker-cpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskgrid-worker-cpu
  template:
    metadata:
      labels:
        app: taskgrid-worker-cpu
    spec:
      containers:
        - name: taskgrid-worker
          image: taskgrid:latest
          imagePullPolicy: Never
          env:
            - name: TASKGRID_MODE
              value: "worker"
            - name: WORKER_TYPE
              value: "cpu"
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: TASKGRID_ALLOW_SHELL_COMMANDS
              value: "false"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"

