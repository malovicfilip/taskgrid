apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskgrid-worker-cpu
spec:
  replicas: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: taskgrid-worker-cpu
  template:
    metadata:
      labels:
        app: taskgrid-worker-cpu
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: taskgrid-worker
          image: taskgrid:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: TASKGRID_MODE, value: worker}
            - {name: WORKER_TYPE, value: cpu}
            - {name: REDIS_ADDR, value: "redis:6379"}
            - {name: TASKGRID_ALLOW_SHELL_COMMANDS, value: "false"}
            - {name: TASKGRID_ALLOWED_COMMANDS, value: "echo,sleep,sha256sum"}
            - {name: TASKGRID_MAX_ATTEMPTS, value: "3"}
            - {name: TASKGRID_JOB_TIMEOUT_SECONDS, value: "30"}
            - {name: TASKGRID_MAX_OUTPUT_BYTES, value: "65536"}
            - {name: TASKGRID_JOB_RETENTION_HOURS, value: "168"}
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
