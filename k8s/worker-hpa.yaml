apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: taskgrid-worker

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskgrid-worker

  minReplicas: 3
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 30

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30