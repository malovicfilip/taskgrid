apiVersion: v1
kind: ConfigMap
metadata:
  name: taskgrid-grafana-dashboard
  labels:
    grafana_dashboard: "1"
data:
  taskgrid.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "title": "Queue depth",
          "type": "timeseries",
          "targets": [{"expr": "max by (queue) (taskgrid_queue_depth)", "legendFormat": "{{queue}}"}],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
        },
        {
          "title": "Jobs completed",
          "type": "timeseries",
          "targets": [
            {"expr": "max(rate(taskgrid_jobs_succeeded_total[5m]))", "legendFormat": "succeeded/s"},
            {"expr": "max(rate(taskgrid_jobs_failed_total[5m]))", "legendFormat": "failed/s"},
            {"expr": "max(rate(taskgrid_job_retries_total[5m]))", "legendFormat": "retried/s"}
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
        },
        {
          "title": "API request rate",
          "type": "timeseries",
          "targets": [{"expr": "sum(rate(taskgrid_http_requests_total[5m]))", "legendFormat": "requests/s"}],
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8}
        },
        {
          "title": "API p95 latency",
          "type": "timeseries",
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(taskgrid_http_request_duration_seconds_bucket[5m])))", "legendFormat": "p95"}],
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 8}
        },
        {
          "title": "AI fallback rate",
          "type": "timeseries",
          "targets": [{"expr": "sum(rate(taskgrid_ai_fallbacks_total[5m]))", "legendFormat": "fallbacks/s"}],
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 8}
        },
        {
          "title": "KEDA worker replicas",
          "type": "timeseries",
          "targets": [
            {"expr": "kube_deployment_spec_replicas{namespace=\"default\",deployment=~\"taskgrid-worker-.*\"}", "legendFormat": "{{deployment}} desired"},
            {"expr": "kube_deployment_status_replicas_available{namespace=\"default\",deployment=~\"taskgrid-worker-.*\"}", "legendFormat": "{{deployment}} available"}
          ],
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 16}
        }
      ],
      "schemaVersion": 39,
      "tags": ["taskgrid"],
      "templating": {"list": []},
      "time": {"from": "now-30m", "to": "now"},
      "title": "TaskGrid Operations",
      "uid": "taskgrid-operations",
      "version": 1
    }
