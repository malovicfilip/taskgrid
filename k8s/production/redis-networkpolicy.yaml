apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-taskgrid-only
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - taskgrid-api
                  - taskgrid-worker-cpu
                  - taskgrid-worker-io
                  - taskgrid-worker-general
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 6379
