name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out ./...
        env:
          TASKGRID_TEST_REDIS_ADDR: localhost:6379
      - name: Build binary
        run: go build ./...
      - name: Build load-test client
        run: go build ./cmd/loadtest
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build container image
        run: docker build -t taskgrid:ci .
